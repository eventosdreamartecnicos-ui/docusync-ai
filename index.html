<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuSync AI - Validador Aduanero</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 48px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .badge {
            display: inline-block;
            background: #e0e7ff;
            color: #4338ca;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            color: var(--text-main);
            margin: 0 0 8px 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #334155;
        }

        select, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            box-sizing: border-box;
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        select {
            cursor: pointer;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        #resultado {
            margin-top: 28px;
            padding: 24px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 5px solid var(--primary);
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.7;
            display: none;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        #btnDescargar {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
            display: none;
            margin-top: 14px;
        }

        #btnDescargar:hover {
            box-shadow: 0 6px 16px rgba(5, 150, 105, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <span class="badge">Inteligencia Aduanera</span>
            <h1>DocuSync AI</h1>
            <p class="subtitle">Clasificación automática de códigos arancelarios mediante IA</p>
        </div>
        
        <div class="form-group">
            <label for="pais">País de Destino (Importación):</label>
            <select id="pais">
                <option value="España / UE">España / Unión Europea</option>
                <option value="México">México</option>
                <option value="Estados Unidos">Estados Unidos</option>
                <option value="Colombia">Colombia</option>
                <option value="Argentina">Argentina</option>
            </select>
        </div>

        <div class="form-group">
            <label for="desc">Descripción detallada del producto:</label>
            <textarea id="desc" placeholder="Ej: Zapatos de cuero con suela de goma para trekking, impermeables..."></textarea>
        </div>
        
        <button onclick="clasificar()">Analizar y Validar Código HS</button>
        
        <div id="resultado"></div>
        <button id="btnDescargar" onclick="descargarInforme()">📥 Descargar Informe Oficial (TXT)</button>
    </div>

    <script>
        let ultimoResultado = "";
        let ultimaDescripcion = "";
        let ultimoPais = "";

        async function clasificar() {
            ultimaDescripcion = document.getElementById('desc').value;
            ultimoPais = document.getElementById('pais').value;
            const resDiv = document.getElementById('resultado');
            const btnDescargar = document.getElementById('btnDescargar');
            
            if (!ultimaDescripcion.trim()) {
                alert('Por favor, escribe una descripción del producto.');
                return;
            }

            resDiv.style.display = 'block';
            resDiv.innerText = 'Analizando especificaciones y consultando base arancelaria... ⏳';
            btnDescargar.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('descripcion', ultimaDescripcion);
                formData.append('pais', ultimoPais);

                const response = await fetch('/clasificar-hs', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                ultimoResultado = data.resultado;
                resDiv.innerText = ultimoResultado;
                btnDescargar.style.display = 'block';
            } catch (error) {
                resDiv.innerText = 'Hubo un error al procesar la solicitud con el servidor.';
            }
        }

        async function descargarInforme() {
            const formData = new FormData();
            formData.append('descripcion', ultimaDescripcion);
            formData.append('pais', ultimoPais);
            formData.append('resultado', ultimoResultado);

            const response = await fetch('/exportar-txt', {
                method: 'POST',
                body: formData
            });

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "informe_docusync.txt";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
    </script>
</body>
</html>
